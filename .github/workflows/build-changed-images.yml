name: Build and Push Changed Images

on:
  push:
    branches:
      - main
    paths:
      - "apps/*/*/**"
      - "workflows/*/apps/**"
      - "workflows/workflow-*"
  workflow_dispatch:
    inputs:
      app_path:
        description: "Full app directory path to build (e.g. apps/a/admet_pipeline_2026_05_27 or workflows/workflow-023/apps/admet_pipeline_2026_05_27)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io/chiral-data

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Detect changed app directories
        id: changed
        run: |
          if [ -n "${{ inputs.app_path }}" ]; then
            DIRS=$(echo "${{ inputs.app_path }}" | jq -R . | jq -sc .)
          else
            # Top-level apps: apps/<letter>/<app_name_date>/
            GLOBAL=$(git diff --name-only HEAD~1 HEAD \
              | grep '^apps/' \
              | awk -F'/' 'NF>=3 {print $1"/"$2"/"$3}' \
              | sort -u \
              | while read dir; do [ -f "$dir/Dockerfile" ] && echo "$dir"; done)

            # Workflow-level apps (direct files): workflows/<wf>/apps/<app_name_date>/
            WORKFLOW_DIRECT=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^workflows/[^/]+/apps/' \
              | awk -F'/' 'NF>=4 {print $1"/"$2"/"$3"/"$4}' \
              | sort -u \
              | while read dir; do [ -f "$dir/Dockerfile" ] && echo "$dir"; done)

            # Workflow-level apps (submodule): scan apps/ inside updated submodules
            WORKFLOW_SUB=$(git diff --name-only HEAD~1 HEAD \
              | awk -F'/' '$1=="workflows" && NF==2 {print $1"/"$2}' \
              | sort -u \
              | while read wf; do
                  find "$wf/apps" -name "Dockerfile" -maxdepth 2 2>/dev/null \
                    | sed 's|/Dockerfile$||'
                done)

            DIRS=$(printf "%s\n%s\n%s" "$GLOBAL" "$WORKFLOW_DIRECT" "$WORKFLOW_SUB" \
              | grep -v '^$' | sort -u | jq -R . | jq -sc .)
          fi
          echo "matrix=$DIRS" >> $GITHUB_OUTPUT
          echo "Changed: $DIRS"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app_path: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Parse image name and tag
        id: meta
        run: |
          FULLNAME=$(basename "${{ matrix.app_path }}")
          APP_NAME=$(echo "$FULLNAME" | sed 's/_20[0-9][0-9]_.*//')
          DATE=$(echo "$FULLNAME" | grep -o '20[0-9][0-9]_[0-9][0-9]_[0-9][0-9].*')
          echo "image=${{ env.REGISTRY }}/${APP_NAME}:${DATE}" >> $GITHUB_OUTPUT
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app_path }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Make package public
        continue-on-error: true
        run: |
          gh api --method PATCH \
            /orgs/chiral-data/packages/container/${{ steps.meta.outputs.app_name }} \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
