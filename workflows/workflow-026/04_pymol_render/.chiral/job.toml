name = "Structure Visualization"
description = "Render pLDDT-colored structure PNG and PAE heatmap"
inputs = ["*_unrelaxed_rank_001_*.pdb", "confidence_summary.json"]
outputs = ["structure_plddt.png", "pae_matrix.png"]

[container]
image = "ghcr.io/sokrypton/colabfold:1.6.1-cuda12"

[scripts]
pre = "pre_run.sh"
run = "run.sh"

[params.color_by]
type = "string"
default = "pLDDT"
hint = "Color scheme: pLDDT, chain, or rainbow"
