name        = "Boltz-2 Structure Prediction"
description = "Validate holo YAML input and run Boltz-2 structure prediction; outputs mmCIF + confidence metrics"
inputs      = ["*.yaml"]
outputs     = ["*_model_*.cif", "confidence_*.json", "affinity_*.json", "pae_*.npz", "pde_*.npz", "plddt_*.npz"]

[container]
image   = "ghcr.io/chiral-data/boltz:2025_09_05"
use_gpu = true

[scripts]
run = "run.sh"

[params.diffusion_samples]
type    = "integer"
default = 10
hint    = "Number of structure models to generate (use 2-3 for testing)"

[params.recycling_steps]
type    = "integer"
default = 5
hint    = "Number of recycling steps through the model trunk"

[params.use_msa_server]
type    = "boolean"
default = true
hint    = "Use ColabFold MSA server for evolutionary information"
