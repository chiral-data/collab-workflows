inputs = [
  "*_generated.cif",
  "design_metrics.json",
  "generation_manifest.json",
]
outputs = [
  "sequences.fasta",
]

[container]
image = "rfd4-proteina:2026_11_04"

[resources]
gpu = "none"

[scripts]
run = "run.sh"
