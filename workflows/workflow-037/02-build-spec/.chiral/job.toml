name = "Build Condition Spec"
description = "Render the task-specific RFD4 condition spec from parameters and validate it by converting to an annotated CIF before any GPU time is spent"
inputs = [
  "target.cif",
  "target_inventory.json",
]
outputs = [
  "design_spec.yaml",
  "spec_preview.cif",
  "target.cif",
]

[container]
image = "rfd4-proteina:2026_11_04"
use_gpu = false

[scripts]
run = "run.sh"

[params.task]
type = "string"
default = "binder"
hint = "Design task: binder, motif_scaffold, monomer, or binder_redesign"

[params.target_chain]
type = "string"
default = "A"
hint = "Chain of the target structure to design against or preserve"

[params.binder_length]
type = "string"
default = "50-120"
hint = "Length range in residues for the designed binder (expandable contig segment)"

[params.contig]
type = "string"
default = ""
hint = "Advanced: full contig string, used verbatim and overriding task templating if set"

[params.hotspot_residues]
type = "string"
default = ""
hint = "Comma-separated target residues to engage, e.g. A45,A46,A82 (becomes C_HOT)"

[params.motif_residues]
type = "string"
default = ""
hint = "Comma-separated motif residues to scaffold; motif_scaffold task only"

[params.redesign_chain]
type = "string"
default = "B"
hint = "Chain to redesign while holding the target fixed; binder_redesign task only"

[params.residue_numbering]
type = "string"
default = "auth"
hint = "Numbering used in hotspot/motif params: auth (PDB author numbering) or label (mmCIF label_seq_id)"
