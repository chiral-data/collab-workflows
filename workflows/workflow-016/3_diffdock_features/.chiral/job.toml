name = "3_feature_extract"
description = "Extract sequences and prepare ESM-2 embeddings"
outputs = [
  "outputs/antibody.fasta",
  "outputs/antigen.fasta",
  "outputs/sequence_info.json",
  "outputs/antibody_features.pt",
  "outputs/antigen_features.pt",
  "outputs/generate_embeddings.py",
  "outputs/data.json",
  "outputs/report.html"
]
[container]
image = "diffdock_abag:v1"
use_gpu = true
[scripts]
run = "3_feature_extract_run.sh"