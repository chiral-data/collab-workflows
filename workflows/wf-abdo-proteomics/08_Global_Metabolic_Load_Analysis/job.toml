[job]
name = "Global Metabolic Load Analysis"
description = "Generate Figure 8 (Total AA by Disease Type)"

[job.input]
data_file = "../01_Data_Ingestion_and_Preprocessing/output/data_standardized.pkl"

[job.output]
directory = "output"
files = [
    "Fig8_TotalAA_Type.png",
    "metabolic_load_data.json",
    "metabolic_load.html"
]

[job.execution]
script = "generate_figure.py"
shell = "bash"
timeout = 600
