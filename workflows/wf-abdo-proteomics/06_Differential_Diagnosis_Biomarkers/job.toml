[job]
name = "Differential Diagnosis Biomarkers"
description = "Generate Figure 4 (Specific AAs) and Figure 5 (Females Only)"

[job.input]
data_file = "../01_Data_Ingestion_and_Preprocessing/output/data_standardized.pkl"

[job.output]
directory = "output"
files = [
    "Fig4_Specific_Diffs.png",
    "Fig5_Female_Specific.png",
    "biomarkers_data.json",
    "biomarkers.html"
]

[job.execution]
script = "generate_figures.py"
shell = "bash"
timeout = 600
