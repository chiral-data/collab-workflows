[job]
name = "MS vs MG Autoimmune Comparison"
description = "Generate Figure 3 (MS+MG vs Controls)"

[job.input]
data_file = "../01_Data_Ingestion_and_Preprocessing/output/data_standardized.pkl"
aa_cols_file = "../01_Data_Ingestion_and_Preprocessing/output/aa_cols.txt"

[job.output]
directory = "output"
files = [
    "Fig3_MS_MG_vs_Control.png",
    "autoimmune_data.json",
    "autoimmune.html"
]

[job.execution]
script = "generate_figure.py"
shell = "bash"
timeout = 600
