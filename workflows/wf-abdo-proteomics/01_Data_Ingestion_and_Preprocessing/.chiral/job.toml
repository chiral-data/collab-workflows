[container]
image = "chiral.sakuracr.jp/proteomics:2025_12_31"

[scripts]
run = "run.sh"

[params.data_file]
type = "string"
default = "database-multiple-sclerosis-myasthenia.csv"
hint = "Input CSV file with proteomics data"
