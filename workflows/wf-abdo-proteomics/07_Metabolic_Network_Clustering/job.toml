[job]
name = "Metabolic Network Clustering"
description = "Generate Figure 6 (MS+MG Correlation) and Figure 7 (Control Correlation)"

[job.input]
data_file = "../01_Data_Ingestion_and_Preprocessing/output/data_standardized.pkl"
aa_cols_file = "../01_Data_Ingestion_and_Preprocessing/output/aa_cols.txt"

[job.output]
directory = "output"
files = [
    "Fig6_Corr_MS_MG.png",
    "Fig7_Corr_Control.png",
    "clustering_data.json",
    "clustering.html"
]

[job.execution]
script = "generate_figures.py"
shell = "bash"
timeout = 600
