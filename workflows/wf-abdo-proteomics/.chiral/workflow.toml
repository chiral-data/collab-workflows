name = "Proteomics Amino Acid Analysis"
description = "Processes proteomics datasets for MS and Myasthenia, performs statistical analysis and visualization of amino acid concentrations"

[dependencies]
02_feature_engineering = ["01_data_ingestion"]
03_standardization = ["02_feature_engineering"]
04_segmentation = ["03_standardization"]
05_statistics = ["04_segmentation"]
06_advanced_analysis = ["03_standardization"]
07_transform = ["03_standardization"]
08_visualization_dashboard = ["05_statistics", "06_advanced_analysis", "07_transform"]

[params.data_file]
type = "string"
default = "database-multiple-sclerosis-myasthenia.csv"
hint = "Input TSV file with proteomics data"

[params.plot_type]
type = "string"
default = "overview"
hint = "Plot type: 'overview' (single boxplot), 'faceted' (per-AA subplots), or 'both'"
