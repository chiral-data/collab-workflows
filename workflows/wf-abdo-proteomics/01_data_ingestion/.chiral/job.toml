name = "Data Ingestion"
description = "Loads raw TSV proteomics database into the pipeline"
outputs = ["data_raw.pkl"]

[container]
image = "chiral.sakuracr.jp/proteomics:2025_12_25_v1"

[scripts]
run = "run.sh"

[params.data_file]
type = "string"
default = "database-multiple-sclerosis-myasthenia.csv"
hint = "Input TSV file with proteomics data"
