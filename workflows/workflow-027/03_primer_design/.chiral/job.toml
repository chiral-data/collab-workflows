name = "Primer Design"
description = "Designs forward primer, reverse primer, and hydrolysis probe for each ROI using Primer3. Applies thermodynamic and structural constraints. Outputs ranked primer sets JSON."
inputs = ["rois.json", "target.fasta", "exclusion.fasta", "global_params.json"]
outputs = ["primer_sets.json", "target.fasta", "exclusion.fasta", "global_params.json"]

[container]
image = "qpcr-pipeline:latest"

[scripts]
run = "run.sh"

[params.primer_min_size]
type = "integer"
default = 19
hint = "Minimum primer length (nt)"

[params.primer_opt_size]
type = "integer"
default = 20
hint = "Optimal primer length (nt)"

[params.primer_max_size]
type = "integer"
default = 26
hint = "Maximum primer length (nt). Increase to 28 for difficult organisms."

[params.primer_min_tm]
type = "float"
default = 59.0
hint = "Minimum primer melting temperature (°C)"

[params.primer_opt_tm]
type = "float"
default = 60.0
hint = "Optimal primer melting temperature (°C)"

[params.primer_max_tm]
type = "float"
default = 62.0
hint = "Maximum primer melting temperature (°C)"

[params.primer_min_gc]
type = "float"
default = 40.0
hint = "Minimum primer GC content (%)"

[params.primer_max_gc]
type = "float"
default = 60.0
hint = "Maximum primer GC content (%)"

[params.amplicon_min]
type = "integer"
default = 70
hint = "Minimum amplicon size (bp)"

[params.amplicon_max]
type = "integer"
default = 200
hint = "Maximum amplicon size (bp)"

[params.probe_min_size]
type = "integer"
default = 22
hint = "Minimum hydrolysis probe length (nt)"

[params.probe_opt_size]
type = "integer"
default = 25
hint = "Optimal hydrolysis probe length (nt)"

[params.probe_max_size]
type = "integer"
default = 29
hint = "Maximum hydrolysis probe length (nt)"

[params.probe_min_gc]
type = "float"
default = 40.0
hint = "Minimum probe GC content (%)"

[params.probe_max_gc]
type = "float"
default = 65.0
hint = "Maximum probe GC content (%)"

[params.probe_tm_delta_min]
type = "float"
default = 5.0
hint = "Minimum probe Tm above mean primer Tm (°C). TaqMan probes should be 5–10°C higher than primers."

[params.probe_tm_delta_max]
type = "float"
default = 10.0
hint = "Maximum probe Tm above mean primer Tm (°C)"
