name        = "PRODIGY Affinity Scoring"
description = "Score all filter-passing designs with PRODIGY (ΔG, Kd). Rank by ΔG ascending. Export top N candidates with optional PyMOL scripts. Chain A = binder, chain B = receptor."
inputs      = ["folded"]
outputs     = ["results/prodigy_all_designs.json", "results/ranked_designs.csv", "results/top10/*.pdb"]

[container]
image = "prodigy:2026_06_30"

[scripts]
run = "run.sh"

[params.temperature]
type    = "float"
default = 25.0
hint    = "Temperature in Celsius for PRODIGY ΔG calculation"

[params.distance_cutoff]
type    = "float"
default = 5.5
hint    = "Distance cutoff in Å for interface contact counting"

[params.pymol_selection]
type    = "boolean"
default = true
hint    = "Write a PyMOL .pml script per top-N design showing interface contacts"
