name        = "Validate Target"
description = "Clean and validate the input receptor PDB. Selects the specified chain, optionally strips heteroatoms and renumbers residues, then writes the output always as chain A for downstream compatibility."
inputs      = ["target.pdb"]
outputs     = ["validated_target.pdb"]

[container]
image = "python:3.11-slim"

[scripts]
pre = "pre_run.sh"
run = "run.sh"

[params.receptor_chain]
type    = "string"
default = "A"
hint    = "Chain ID of the receptor in the input PDB to extract"

[params.hotspot_residues]
type    = "string"
default = ""
hint    = "Comma-separated residue IDs to validate exist, e.g. A55,A58,A102. Warnings only — does not halt."

[params.strip_heteroatoms]
type    = "boolean"
default = true
hint    = "Remove HETATM records before processing"

[params.renumber_residues]
type    = "boolean"
default = true
hint    = "Renumber residues starting from 1"
