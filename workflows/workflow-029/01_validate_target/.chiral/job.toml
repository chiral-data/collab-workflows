name        = "Validate Target"
description = "Clean and validate the input receptor PDB. Selects the specified chain, optionally strips heteroatoms, detects chain breaks and records the receptor's contiguous segments, then writes the output always as chain A for downstream compatibility."
inputs      = ["target.pdb"]
outputs     = ["validated_target.pdb"]

[container]
image = "biopython:2026_06_30"

[scripts]
run = "run.sh"

[params.strip_heteroatoms]
type    = "boolean"
default = true
hint    = "Remove HETATM records before processing"

[params.renumber_residues]
type    = "boolean"
default = false
hint    = "Renumber residues starting from 1. Off by default: renumbering closes over missing loops, so RFdiffusion is handed the residues flanking a gap as though they were bonded. Turn it on only for a target whose numbering a contig cannot express — non-positive or duplicated residue numbers."
