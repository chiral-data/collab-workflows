name        = "ColabFold Fold and Filter"
description = "Fold each ProteinMPNN sequence with ColabFold (AlphaFold2 multimer) and filter by four self-consistency metrics: iPTM, pLDDT (binder), Cα RMSD vs backbone, and interface PAE."
inputs      = ["sequences", "validated_target.pdb", "backbones"]
outputs     = ["folded/design_*_rank001.pdb", "folded/filter_report.json"]

[container]
image   = "colabfold:2026_10_08"
use_gpu = true

[scripts]
run = "run.sh"

[params.num_recycle]
type    = "integer"
default = 6
hint    = "Number of AlphaFold2 recycling iterations"

[params.msa_mode]
type    = "string"
default = "mmseqs2_uniref_env"
hint    = "MSA mode: mmseqs2_uniref_env (required for interface metrics; queries the public ColabFold MSA server) or single_sequence (faster, but iPTM and interface PAE are not meaningful)"

# Declares, rather than blocks, what leaves the machine. See the workflow README
# section "What this workflow sends outside your machine" for why the default stays.
[[external_services]]
name  = "ColabFold MSA server"
host  = "api.colabfold.com"
sends = ["binder sequence", "receptor sequence"]
when  = { param = "msa_mode", equals = "mmseqs2_uniref_env" }
