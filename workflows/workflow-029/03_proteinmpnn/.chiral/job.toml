name        = "ProteinMPNN Sequence Design"
description = "Design amino acid sequences for each RFdiffusion backbone. Designs chain A (binder) while holding chain B (receptor) fixed. Outputs one FASTA per backbone containing num_seq_per_target sequences."
inputs      = ["backbones/design_*.pdb"]
outputs     = ["sequences/design_*.fasta"]

[container]
image   = "ghcr.io/chiral-data/proteinmpnn:2025_09_10"
use_gpu = true

[scripts]
run = "run.sh"

[params.num_seq_per_target]
type    = "integer"
default = 8
hint    = "Number of sequences to design per backbone"

[params.sampling_temp]
type    = "float"
default = 0.1
hint    = "Sampling temperature: lower = more conservative, higher = more diverse"

[params.chain_to_design]
type    = "string"
default = "A"
hint    = "Chain to design sequences for (binder chain; always A after RFdiffusion)"

[params.use_soluble_model]
type    = "boolean"
default = true
hint    = "Use SolubleMPNN model — dramatically improves wet-lab expression rates"

[params.use_gpu]
type    = "boolean"
default = true
hint    = "Requires a CUDA-capable GPU"
