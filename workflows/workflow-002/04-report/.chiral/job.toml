name = "Generate Report"
description = "Analyzes results and generates rankings"
inputs = ["*.txt", "*.sdf", "*.pdb"]
outputs = ["results/*.txt", "results/*.sdf", "results/*.pdb"]

[container]
image = "ghcr.io/chiral-data/smina:2025_10_17_v2"

[scripts]
run = "run.sh"

[params.top_n]
type = "integer"
default = 10
hint = "Number of top compounds to display"
