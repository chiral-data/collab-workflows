name = "Generate Report"
description = "Analyzes results and generates rankings"
inputs = ["docking_results/*.txt", "docking_results/*.sdf", "*.pdb"]
outputs = ["results/*.txt", "results/*.sdf", "results/*.pdb"]

[container]
image = "chiral.sakuracr.jp/smina:2025_10_17_v2"

[scripts]
run = "run.sh"

[params.top_n]
type = "integer"
default = 10
hint = "Number of top compounds to display"
