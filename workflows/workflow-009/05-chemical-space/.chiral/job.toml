name = "Chemical Space Creation"
description = "Build chemical space by combining scaffold with linkers and R-groups"
inputs = ["scaffold.pkl", "rec_final.pdb", "*.smi"]
outputs = ["chemspace.pkl", "rec_final.pdb", "chemspace_viz.html"]

[container]
image = "chiral.sakuracr.jp/fegrow:2026_01_10_v4"

[scripts]
run = "run.sh"

[params.num_linkers]
type = "integer"
default = 10
hint = "Number of linkers to use for chemical space generation"

[params.num_rgroups]
type = "integer"
default = 10
hint = "Number of R-groups to use for chemical space generation"
