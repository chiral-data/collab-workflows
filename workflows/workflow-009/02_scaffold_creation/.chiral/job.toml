name = "Scaffold Creation"
description = "Create scaffold molecule with attachment point from the ligand"
inputs = ["*.sdf"]
outputs = ["scaffold.pkl", "scaffold_viz.html"]

[container]
image = "chiral.sakuracr.jp/fegrow:2026_01_10_v4"

[scripts]
run = "run.sh"

[params.attachment_id]
type = "integer"
default = 27
hint = "Atom index for the attachment point on the scaffold"
