name = "Generate Report"
description = "Merge Vina and GNINA results; compute ranking statistics; generate interactive HTML report"

inputs = ["vina_screening_scores.csv", "gnina_screening_scores.csv", "vina_screening_poses.pdbqt", "gnina_screening_poses.sdf", "vina_docking_report.json", "gnina_docking_report.json"]
outputs = ["comparative_screening_metrics.csv", "docking_performance_report.html"]

[container]
image = "vina-gnina-pipeline:latest"
use_gpu = false

[scripts]
run = "run.sh"
