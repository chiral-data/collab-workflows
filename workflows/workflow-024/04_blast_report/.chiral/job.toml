name = "BLAST Validation and Report"
description = "Builds a local BLAST+ database from target and exclusion sequences, validates top primer sets for specificity, and generates JSON, TSV, and human-readable TXT reports."
inputs = ["primer_sets.json", "target.fasta", "exclusion.fasta", "global_params.json"]
outputs = ["results.json", "results.tsv", "report.txt"]

[container]
image = "qpcr-pipeline:latest"

[scripts]
run = "run.sh"

[params.blast_sets]
type = "integer"
default = 3
hint = "Number of top primer sets to validate with BLAST"

[params.skip_blast]
type = "boolean"
default = false
hint = "Set to true to skip BLAST validation and generate report from Primer3 results only"
