name = "Download Sequences"
description = "Fetches target and exclusion FASTA sequences from NCBI Entrez. If target.fasta and exclusion.fasta are present in input_files/, uses those instead (offline mode)."
outputs = ["target.fasta", "exclusion.fasta", "global_params.json"]

[container]
image = "qpcr-pipeline:latest"

[scripts]
run = "run.sh"

[params.organism]
type = "string"
default = "Rickettsia rickettsii"
hint = "Target organism scientific name (e.g. 'Cyclospora cayetanensis')"

[params.email]
type = "string"
default = "user@example.com"
hint = "Email address for NCBI Entrez (required by NCBI policy)"

[params.ncbi_api_key]
type = "string"
default = ""
hint = "NCBI API key (optional; raises rate limit from 3 to 10 requests/sec)"

[params.target_gene]
type = "string"
default = ""
hint = "Target a specific gene instead of whole genome (e.g. cpn60, rpoB, rnaseh). Leave empty for whole-genome mode."

[params.max_target_seqs]
type = "integer"
default = 3
hint = "Max target sequences to fetch from NCBI"

[params.max_relative_seqs]
type = "integer"
default = 5
hint = "Max close-relative sequences to fetch for exclusion screening (whole-genome mode capped at 5 if >10MB total)"
