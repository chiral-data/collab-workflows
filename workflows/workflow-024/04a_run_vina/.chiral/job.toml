name = "AutoDock Vina Screening"
description = "Dock screening library with AutoDock Vina; collect poses and ΔG affinities"

inputs = ["receptor.pdbqt", "optimized_screening_library.pdbqt", "pocket_config.txt"]
outputs = ["vina_screening_poses.pdbqt", "vina_screening_scores.csv", "vina_runtime_log.txt", "vina_docking_report.json"]

[container]
docker_file = "Dockerfile"
use_gpu = false

[scripts]
run = "run.sh"

[params.exhaustiveness]
type = "integer"
default = 8
hint = "Vina exhaustiveness (higher = more thorough, slower)"

[params.num_modes]
type = "integer"
default = 9
hint = "Number of binding modes to generate per ligand"
