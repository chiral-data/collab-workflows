name = "Prepare Docking Swarms"
description = "Runs lightdock3_setup.py to generate swarm positions and initial glowworm configurations"

inputs = ["receptor.pdb", "ligand.pdb"]
outputs = ["receptor.pdb", "ligand.pdb", "lightdock_workspace.tar.gz"]

[container]
image = "lightdock-pipeline:latest"

[scripts]
run = "run.sh"

[params.num_swarms]
type = "integer"
default = 10
hint = "Number of independent swarms (use 400 for production, 5 for quick testing)"

[params.num_glowworms]
type = "integer"
default = 200
hint = "Number of glowworms per swarm"
