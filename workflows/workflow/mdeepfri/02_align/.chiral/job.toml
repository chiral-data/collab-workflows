name = "Download Model Weights"
description = "Downloads DeepFRI GCN and CNN model weights for structural alignment and function prediction"

inputs = ["validated.fasta"]
outputs = ["validated.fasta", "*.onnx", "*.json"]

[container]
image = "mdeepfri:latest"

[scripts]
run = "run.sh"

[params.model_version]
type = "enum"
default = "1.1"
hint = "DeepFRI model version (1.1 recommended: supports BP, CC, MF; 1.0 also supports EC)"
enum_values = ["1.0", "1.1"]
