name = "Calculate Pockets"
description = "Detects protein pockets using pocketeer library"
inputs = ["*.pdb"]
outputs = ["*.pdb", "*.json"]

[container]
image = "chiral.sakuracr.jp/pocketeer:2025_12_08"

[scripts]
run = "run.sh"

[params.r_min]
type = "float"
default = 3.0
hint = "Minimum alpha-sphere radius in Angstroms"

[params.r_max]
type = "float"
default = 6.0
hint = "Maximum alpha-sphere radius in Angstroms"

[params.polar_probe_radius]
type = "float"
default = 1.8
hint = "Radius to test atom contact for polarity in Angstroms"

[params.merge_distance]
type = "float"
default = 1.2
hint = "Distance threshold for merging nearby sphere clusters in Angstroms"

[params.min_spheres]
type = "integer"
default = 35
hint = "Minimum number of spheres per pocket cluster"

[params.ignore_hydrogens]
type = "boolean"
default = true
hint = "Remove hydrogen atoms (recommended: true)"

[params.ignore_water]
type = "boolean"
default = true
hint = "Remove water molecules (recommended: true)"

[params.ignore_hetero]
type = "boolean"
default = true
hint = "Remove hetero atoms/ligands (recommended: true)"
