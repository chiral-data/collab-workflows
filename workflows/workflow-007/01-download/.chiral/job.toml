name = "Download PDB"
description = "Downloads PDB files from RCSB database"
outputs = ["*.pdb", "*.json"]

[params.pdb_ids]
type = "string"
default = "1FME, 2RH1, 4TOS"
hint = "Comma-separated PDB IDs to download and analyze (e.g., 4TOS, 1FME, 2RH1)"

[container]
image = "ghcr.io/chiral-data/pocketeer:2025_12_08"

[scripts]
run = "run.sh"
