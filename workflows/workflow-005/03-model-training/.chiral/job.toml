name = "Model Training"
description = "Train neural network model"
depends_on = ["02-feature-engineering"]
inputs = ["processed_data.npz"]
outputs = ["outputs/model.h5", "outputs/data.json", "outputs/report.html"]

[container]
image = "qsar:20260527"

[scripts]
run = "run.sh"

[params.epochs]
type = "string"
default = "200"
hint = "Number of training epochs (original workflow uses 200 with early stopping)"

[params.batch_size]
type = "string"
default = "400"
hint = "Batch size for training (original workflow uses 400)"
