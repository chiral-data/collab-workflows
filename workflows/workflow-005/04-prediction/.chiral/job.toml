name = "Prediction"
description = "Make predictions on test SMILES"
depends_on = ["00-download-inputs", "02-feature-engineering", "03-model-training"]
inputs = ["scaler.pkl", "ad_stats.json", "model.h5", "*.csv"]
outputs = ["outputs/data.json", "outputs/report.html", "outputs/predictions.csv"]

[container]
image = "qsar:20260527"

[scripts]
run = "run.sh"

[params.test_smiles]
type = "string"
default = ""
hint = "Comma-separated SMILES strings to predict, e.g., CCO,c1ccccc1. Leave empty if using predict_all_data=true"

[params.predict_all_data]
type = "string"
default = "true"
hint = "If true, predict on all compounds from input dataset. If false, requires test_smiles parameter"

