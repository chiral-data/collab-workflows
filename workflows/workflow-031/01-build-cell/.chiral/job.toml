name        = "Build Amorphous Polymer Cell"
description = "Generates a 5-mer oligomer with RDKit, assigns GAFF2 charges with antechamber/AM1-BCC, packs an amorphous cell at 60% target density with packmol, and converts to GROMACS format with acpype."

outputs = ["system.gro", "topol.top", "cell.pdb", "build_report.json"]

[container]
image = "barrier_films:2026_06_27"

[scripts]
run = "run.sh"

[params.resin_type]
type        = "enum"
default     = "LDPE"
hint        = "Polymer matrix resin (PET unsupported — see README)"
enum_values = ["LDPE", "PP", "EVOH", "PA6", "PET"]

[params.n_chains]
type    = "integer"
default = 20
hint    = "Number of polymer chains in the amorphous cell"
