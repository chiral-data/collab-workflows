name = "4_predict_from_csv"
description = "Generate predictions for new SMILES"
depends_on = ["2_model_train"]
inputs = ["hybrid_model.keras", "hybrid_ultimate_pipeline.pkl", "inputs/*.csv"]
outputs = ["outputs/data.json", "outputs/report.html", "outputs/predictions.csv"]

[container]
image = "chiral.sakuracr.jp/qsar-hybrid-model:v3"

[scripts]
run = "run.sh"

[params.predict_all_data]
type = "string"
default = "true"
hint = "If true, predict on all compounds"
