name = "VS Analytics"
description = "High-throughput docking with AutoDock Vina and dashboard generation"
outputs = ["outputs/virtual_screening_metadata.json", "outputs/*_docked.pdbqt", "outputs/report.html"]

[container]
image = "vina-workflow:latest"

[scripts]
run = "run.sh"

[params.exhaustiveness]
type = "integer"
default = 32
hint = "Vina search exhaustiveness"
env = "PARAM_EXHAUSTIVENESS"

[params.num_modes]
type = "integer"
default = 10
hint = "Max number of binding modes to generate"
env = "PARAM_NUM_MODES"

[params.energy_range]
type = "float"
default = 5.0
hint = "Energy range (kcal/mol) between best and worst pose"
env = "PARAM_ENERGY_RANGE"