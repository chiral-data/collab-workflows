        .ligand-card {

        .ligand-card.error {

        }

            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        .status-badge {

            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.success {
            background: rgba(255,255,255,0.3);

        }
        .status-badge.error {
            background: #dc3545;
            color: white;
        }
        .viewport {
            width: 100%;
            height: 320px;
            background: #1a1a2e;
        }
        .card-footer {
            padding: 20px;
            background: #f8f9fa;
        }
        .info-item {

            padding: 8px 0;
