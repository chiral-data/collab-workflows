name = "Receptor Acquisition"
description = "Download and validate receptor structures from RCSB PDB"
outputs = ["outputs/receptor_metadata.json", "outputs/*.pdb", "outputs/report.html"]

[container]
image = "vina-workflow:latest"

[scripts]
run = "run.sh"

[params.pdb_id]
type = "string"
default = "5kir"
hint = "PDB ID to download (e.g., 5kir, 1hsg)"
env = "PARAM_PDB_ID"