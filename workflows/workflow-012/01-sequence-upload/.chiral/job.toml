name = "Sequence Upload"
description = "Upload and validate protein sequence YAML file for Boltz-2 prediction"
outputs = ["*.yaml", "input_summary.json"]

[container]
image = "chiral.sakuracr.jp/boltz:2025_09_05"

[scripts]
run = "run.sh"

[params.input_file]
type = "file"
default = ".chiral/test_inputs/prot.yaml"
hint = "Boltz-2 input YAML file with protein sequence(s)"
