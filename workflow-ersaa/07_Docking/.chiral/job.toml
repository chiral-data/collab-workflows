# Hard dependencies
depends_on = ["03_ProteinPreparation", "04_LigandPreparation"]

# Optional dependency (user may provide custom grids)
optional_depends_on = ["06_PocketSelection"]

[inputs]
receptor_pdbqt = { type = "file", required = true }
ligands_prepared = { type = "folder", required = true }
grid_boxes = { type = "file", required = true }

[outputs]
vina_results = { type = "folder", path = "vina_results" }

[params]
exhaustiveness = { type = "integer", default = 8 }
num_modes      = { type = "integer", default = 9 }
energy_range   = { type = "integer", default = 4 }

[container]
dockerfile = "Dockerfile"

[scripts]
